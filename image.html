<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore Eagle Hospital facilities, healthcare professionals and hospital spaces.">
  <title>Gallery | Eagle Hospital</title>
  <link rel="stylesheet" href="all.css">
</head>
<body>

<header class="header">
  <div class="container header-inner">

    <a class="brand" href="index.html" aria-label="Eagle Hospital home">
      <span class="brand-mark">EH</span>
      <span>
        Eagle Hospital
        <small>HEALTHCARE &amp; CARE</small>
      </span>
    </a>

    <div class="header-right">

      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a class="active" href="image.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>

      <button class="theme-toggle" id="themeToggle" type="button"
              aria-label="Switch to night mode"
              title="Switch to night mode">
        <span id="themeIcon" aria-hidden="true">🌙</span>
      </button>

    </div>
  </div>
</header>

<main class="page">

  <div class="container">

    <div class="page-title">
      <p class="eyebrow">OUR VISUAL GALLERY</p>

      <h1>Hospital Gallery</h1>

      <p>
        Explore the hospital, medical professionals and healthcare
        spaces using the images included with this website.
      </p>
    </div>

    <section class="gallery" aria-label="Hospital gallery">

      <figure class="gallery-item">
        <img src="images/sur.jfif"
             alt="Hospital facility"
             loading="lazy">
        <figcaption class="gallery-caption">
          Hospital Facility
        </figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/doc1.jfif"
             alt="Doctor"
             loading="lazy">
        <figcaption class="gallery-caption">
          Medical Professional
        </figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/doc2.jfif"
             alt="Medical professional"
             loading="lazy">
        <figcaption class="gallery-caption">
          Healthcare Team
        </figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/res1.jfif"
             alt="Hospital room"
             loading="lazy">
        <figcaption class="gallery-caption">
          Patient Room
        </figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/res2.jfif"
             alt="Hospital facility"
             loading="lazy">
        <figcaption class="gallery-caption">
          Care Environment
        </figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/one.jfif"
             alt="Healthcare facility"
             loading="lazy">
        <figcaption class="gallery-caption">
          Hospital Environment
        </figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/six.jfif"
             alt="Healthcare team"
             loading="lazy">
        <figcaption class="gallery-caption">
          Healthcare
        </figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/doctor.jfif"
             alt="Doctor at work"
             loading="lazy">
        <figcaption class="gallery-caption">
          Doctor at Work
        </figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/four.jfif"
             alt="Hospital facility"
             loading="lazy">
        <figcaption class="gallery-caption">
          Hospital Facility
        </figcaption>
      </figure>

    </section>

  </div>

</main>

<footer>
  <div class="container footer-inner">
    <strong>Eagle Hospital</strong>
    <p>© 2026 Eagle Hospital</p>
  </div>
</footer>

<script src="theme.js"></script>

</body>
</html>
